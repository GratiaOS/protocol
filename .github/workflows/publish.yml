name: Publish

# A merge to main publishes when, and only when, the version in package.json is not on npm yet: the bump of the version, in a pull
# request, is the word. A merge that leaves the version as it is publishes nothing.
# There is no NPM_TOKEN: npm trusts this repository and this file name (Trusted Publishing, OIDC), once it is set per package on
# npmjs.com (RELEASING.md). Do not rename this file without changing it there too.

on:
  push:
    branches:
      - main
  # A run can be started by hand (Actions → Publish → Run workflow): the retry of a version that did not get published, without a commit.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Is this version new?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'

      - name: Validate
        run: node scripts/validate.mjs

      - name: Compare with npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$name@$version is on npm already: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is new."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm (Trusted Publishing / OIDC)
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # An environment called "npm" may ask a person to approve each release (Settings → Environments); it is only asked when a version is new.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'

      # Without sudo, and after setup-node: the npm that runs is the one in the toolcache of setup-node (npm 10 for node 22), and "sudo npm
      # install -g" put npm 11 somewhere else, so the publish ran with npm 10, which cannot swap the OIDC token for a publish token (a 404).
      - name: Ensure npm >=11.5.1 (required for Trusted Publishing)
        run: |
          npm install -g npm@^11.5.1
          echo "npm $(npm --version) at $(command -v npm)"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"

      # Verbose, so that when npm cannot swap this run's OIDC token for a publish token, the log says why (the default is silence, then a 404).
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_LOGLEVEL: verbose

      # After the publish, the version is written down: a tag and a release on GitHub.
      - name: Tag the release
        run: gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes --target "${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
